
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Woskcorp</title>
  <meta name="description" content="Bienvenido a nuestro negocio. Conoce nuestros productos y servicios.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #172033;
    }
    header {
      background: #142850;
      color: white;
      text-align: center;
      padding: 35px 15px;
    }
    header h1 { margin: 0; font-size: 34px; }
    nav { margin-top: 18px; }
    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }
    main {
      max-width: 850px;
      margin: auto;
      padding: 25px 16px;
    }
    .hero {
      text-align: center;
      padding: 45px 18px;
      background: white;
      border-radius: 16px;
      margin-bottom: 20px;
    }
    .hero h2 { font-size: 30px; }
    .btn {
      display: inline-block;
      background: #1677ff;
      color: white;
      padding: 14px 22px;
      border-radius: 9px;
      text-decoration: none;
      margin-top: 12px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      margin-bottom: 18px;
    }
    footer {
      text-align: center;
      padding: 25px;
      background: #142850;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>Woskcorp</h1>
    <nav>
      <a href="#inicio">Inicio</a>
      <a href="#servicios">Servicios</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="inicio">
      <h2>¡Bienvenido a nuestro negocio!</h2>
      <p>Calidad, confianza y atención para ti.</p>
      <a class="btn" href="#contacto">Contáctanos</a>
    </section>

    <section class="card" id="servicios">
      <h2>Nuestros servicios</h2>
      <p>Aquí puedes presentar tus productos,
      servicios y ofertas especiales.</p>
    </section>

    <section class="card" id="contacto">
      <h2>Contacto</h2>
      <p>¿Tienes preguntas? Pronto podrás
      encontrarnos aquí.</p>
    </section>
  </main>

  <footer>
    <p>© 2026 Mi Negocio</p>
  </footer>
</body>
</html>
